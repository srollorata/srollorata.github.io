name: Update Visitor Stats

on:
  schedule:
    # Runs every day at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-analytics-data

      - name: Fetch GA4 stats
        env:
          GOOGLE_APPLICATION_CREDENTIALS_DATA: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: python scripts/fetch_ga_data.py

      - name: Push changes and create pull request
        run: |
          # Authenticate gh CLI with PAT
          echo "${{ secrets.PAT_TOKEN }}" | gh auth login --with-token

          # Create unique branch name
          BRANCH="stats/update-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add data/stats.json

          # Exit if no changes
          git diff --staged --quiet && exit 0

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update visitor stats [skip ci]"
          git push origin "$BRANCH"

          # Create PR and enable auto-merge
          PR_URL=$(gh pr create \
            --title "chore: update visitor stats" \
            --body "Automated daily visitor stats update from Google Analytics." \
            --base main \
            --head "$BRANCH")
          echo "Created PR: $PR_URL"

          # Enable auto-merge with squash, delete branch on merge
          gh pr merge --auto --squash --delete-branch "$BRANCH"